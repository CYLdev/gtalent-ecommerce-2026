<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="歡迎來到 gtalent ecommerce，我們正在準備更好的購物體驗。">
    <title>歡迎來到 gtalent ecommerce</title>
    <style>
        :root {
            --ink: #17352d;
            --paper: #f4f0e6;
            --accent: #ef6f4d;
            --line: rgba(23, 53, 45, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 18%, rgba(239, 111, 77, 0.16), transparent 27rem),
                var(--paper);
            font-family: "Avenir Next", "PingFang TC", "Noto Sans TC", sans-serif;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            content: "";
            opacity: 0.28;
            background-image: linear-gradient(var(--line) 1px, transparent 1px),
                              linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
        }

        .page {
            display: grid;
            min-height: 100vh;
            grid-template-rows: auto 1fr auto;
            padding: 28px clamp(24px, 6vw, 88px);
        }

        header,
        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            color: inherit;
            font-size: 0.84rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: rgba(23, 53, 45, 0.72);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
        }

        .status::before {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #35a36f;
            box-shadow: 0 0 0 5px rgba(53, 163, 111, 0.13);
            content: "";
        }

        main {
            display: grid;
            width: min(1180px, 100%);
            margin: auto;
            grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
            align-items: center;
            gap: clamp(48px, 8vw, 120px);
            padding: 72px 0;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 0 0 24px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 40px;
            height: 2px;
            background: var(--accent);
            content: "";
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-family: "Iowan Old Style", "Songti TC", serif;
            font-size: clamp(3.4rem, 8vw, 7.8rem);
            font-weight: 500;
            letter-spacing: -0.065em;
            line-height: 0.93;
        }

        h1 span {
            display: block;
            color: var(--accent);
            font-style: italic;
        }

        .intro {
            max-width: 540px;
            margin: 32px 0 0;
            color: rgba(23, 53, 45, 0.72);
            font-size: clamp(1rem, 1.7vw, 1.18rem);
            line-height: 1.85;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 38px;
        }

        .button {
            display: inline-flex;
            min-height: 50px;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            border: 1px solid var(--ink);
            color: var(--paper);
            background: var(--ink);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .button.secondary {
            color: var(--ink);
            background: transparent;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 7px 7px 0 var(--accent);
        }

        .art {
            position: relative;
            display: grid;
            width: min(390px, 82vw);
            aspect-ratio: 4 / 5;
            place-items: center;
            justify-self: center;
        }

        .art::before {
            position: absolute;
            inset: 5% 0 0 8%;
            border: 1px solid var(--ink);
            border-radius: 50% 50% 8% 8%;
            content: "";
            transform: rotate(5deg);
        }

        .sun {
            position: absolute;
            top: 0;
            right: -5%;
            width: 42%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--accent);
            animation: float 5s ease-in-out infinite;
        }

        .bag {
            position: relative;
            z-index: 1;
            display: grid;
            width: 62%;
            height: 56%;
            margin-top: 24%;
            place-items: center;
            border: 2px solid var(--ink);
            border-radius: 3px 3px 28px 28px;
            background: #d7c897;
            box-shadow: 18px 18px 0 rgba(23, 53, 45, 0.12);
            transform: rotate(-4deg);
        }

        .bag::before {
            position: absolute;
            top: -30%;
            width: 56%;
            height: 42%;
            border: 2px solid var(--ink);
            border-bottom: 0;
            border-radius: 50% 50% 0 0;
            content: "";
        }

        .bag-mark {
            font-family: "Iowan Old Style", Georgia, serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-style: italic;
        }

        footer {
            padding-top: 22px;
            border-top: 1px solid var(--line);
            color: rgba(23, 53, 45, 0.58);
            font-size: 0.76rem;
            letter-spacing: 0.05em;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        @media (max-width: 760px) {
            .page {
                padding: 22px;
            }

            main {
                grid-template-columns: 1fr;
                padding: 64px 0 72px;
            }

            .art {
                width: min(330px, 80vw);
                grid-row: 1;
            }

            h1 {
                font-size: clamp(3.5rem, 19vw, 5.5rem);
            }

            footer {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <a class="brand" href="/" aria-label="gtalent ecommerce 首頁">gtalent / ecommerce</a>
        <span class="status">服務運作中</span>
    </header>

    <main>
        <section aria-labelledby="welcome-title">
            <p class="eyebrow">Welcome to our store</p>
            <h1 id="welcome-title">歡迎來到<span>美好日常。</span></h1>
            <p class="intro">
                gtalent ecommerce 正在為你準備簡單、安心且愉快的購物體驗。網站已成功上線，更多精選商品即將登場。
            </p>
            <div class="actions">
                <a class="button" href="#about">開始探索</a>
                <a class="button secondary" href="/actuator/health">查看服務狀態</a>
            </div>
        </section>

        <div class="art" aria-hidden="true">
            <div class="sun"></div>
            <div class="bag">
                <span class="bag-mark">g.</span>
            </div>
        </div>
    </main>

    <footer id="about">
        <span>gtalent ecommerce 2026</span>
        <span>Designed for everyday moments.</span>
    </footer>
</div>
</body>
</html>
